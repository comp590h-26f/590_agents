[project]
name = "590-agents"
version = "0.1.0"
description = "Standalone CLI agents for COMP 590, independent of evaluation frameworks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
agents590 = "agents590.cli:main"
openai-smoke = "agents590.smoke:main"

[project.entry-points."agents590.agents"]
leoa_CamelAgent = "agents590.leoa_CamelAgent:leoa_CamelAgent"
krisj_starter = "agents590.krisj_starter:StarterAgent"
krisj_echo = "agents590.krisj_echo:EchoAgent"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents590"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
